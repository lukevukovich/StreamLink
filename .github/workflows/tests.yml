name: Tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run StreamLink.Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore StreamLink.Tests/StreamLink.Tests.csproj

      - name: Run tests
        run: dotnet test StreamLink.Tests/StreamLink.Tests.csproj --configuration Release --no-restore
